name: Build TDLib for Windows 64-bit

on:
  workflow_dispatch: # Allows you to run the workflow manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'

    - name: Clone TDLib
      shell: pwsh
      run: |
        git clone https://github.com/tdlib/td.git

    - name: Clone vcpkg
      shell: pwsh
      run: |
        cd td
        git clone https://github.com/Microsoft/vcpkg.git
        # Intentionally leaving out the old git checkout commit
        # Using master branch prevents MSYS2 404 download errors

    - name: Cache vcpkg dependencies
      uses: actions/cache@v4
      id: vcpkg-cache
      with:
        path: |
          td/vcpkg/installed
          td/vcpkg/packages
          td/vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-master-static-v1
        restore-keys: |
          ${{ runner.os }}-vcpkg-master-static-

    - name: Build and Install dependencies (vcpkg)
      shell: pwsh
      env:
        VCPKG_DEFAULT_TRIPLET: x64-windows-static
      run: |
        cd td/vcpkg
        ./bootstrap-vcpkg.bat
        ./vcpkg.exe install gperf openssl zlib

    - name: Build and Install TDLib
      shell: pwsh
      run: |
        cd td
        Remove-Item build -Force -Recurse -ErrorAction SilentlyContinue
        mkdir build
        cd build
        
        # Force static linking for both vcpkg and MSVC runtime to prevent linker errors
        cmake -A x64 `
          -DCMAKE_INSTALL_PREFIX:PATH=../tdlib `
          -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
          ..
          
        cmake --build . --target install --config Release

    - name: Verify tdlib directory
      shell: pwsh
      run: dir td/tdlib

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tdlib-release-windows-x64
        path: td/tdlib/
        if-no-files-found: error
