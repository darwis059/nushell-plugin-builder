name: Build TDLib for Windows 64-bit

on:
  workflow_dispatch: # Allows you to run the workflow manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # TDLib requires PHP for generating some code files during the build process
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # You can use any recent PHP 8.x version

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: |
            td/vcpkg/installed
            td/vcpkg/packages
            td/vcpkg/downloads
          # The cache key is bound to the specific vcpkg commit required by TDLib
          key: ${{ runner.os }}-vcpkg-bc3512a509f9d29b37346a7e7e929f9a26e66c7e
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Build and Install TDLib
        shell: pwsh
        run: |
          # 1. Clone TDLib
          git clone https://github.com/tdlib/td.git
          cd td
          
          # 2. Clone vcpkg and checkout the exact commit recommended by TDLib
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          git checkout bc3512a509f9d29b37346a7e7e929f9a26e66c7e
          
          # 3. Bootstrap vcpkg and install dependencies (zlib, openssl, gperf)
          ./bootstrap-vcpkg.bat
          ./vcpkg.exe install gperf:x64-windows openssl:x64-windows zlib:x64-windows
          cd ..
          
          # 4. Prepare CMake build directory
          Remove-Item build -Force -Recurse -ErrorAction SilentlyContinue
          mkdir build
          cd build
          
          # 5. Configure and build targetting the "td/tdlib" directory
          cmake -A x64 -DCMAKE_INSTALL_PREFIX:PATH=../tdlib -DCMAKE_TOOLCHAIN_FILE:FILEPATH=../vcpkg/scripts/buildsystems/vcpkg.cmake ..
          cmake --build . --target install --config Release
          cd ../..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-release-windows-x64
          # Because of -DCMAKE_INSTALL_PREFIX:PATH=../tdlib, all final artifacts are placed here
          path: td/tdlib/
          if-no-files-found: error
